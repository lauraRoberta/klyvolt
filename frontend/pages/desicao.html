<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decisão | Klyvolt</title>
  <link rel="stylesheet" href="../static/empresa.css">
  <link rel="stylesheet" href="../static/crud.css">
  <script src="../js/api.js" defer></script>
  <script src="../js/nav.js" defer></script>
  <script src="../js/crud.js" defer></script>
</head>
<body>
  <header class="cabecalho">
    <div class="container">
      <a class="marca" href="empresa.html">
        <img class="logo" src="../static/klyvolt-logo.svg" alt="" width="44" height="44">
        <span>Klyvolt</span>
      </a>
      <span class="subtitulo">Gestão de consumo elétrico</span>
    </div>
  </header>

  <main class="container" data-rota="/decisoes" data-chave="id_decisao" data-nome="decisão" data-editar="nao" data-excluir="nao">
    <div class="titulo-pagina">
    
      <h1>Decisão</h1>
      <p>Catálogo de decisões que o sistema aciona automaticamente a partir de um limite.</p>
    </div>

    <p id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></p>

    <section class="painel" aria-labelledby="titulo-formulario">
      <div class="painel-titulo">
        <h2 id="titulo-formulario">Cadastrar decisão</h2>
        <span class="legenda">DADOS</span>
      </div>
      <form id="form-registro" class="formulario" novalidate>
        <div class="campos">
          <div class="campo">
            <label for="f-nome_decisao">Nome da decisão</label>
            <input type="text" id="f-nome_decisao" data-campo="nome_decisao" required maxlength="100" placeholder="Ex.: Alto consumo de energia">
          </div>
          <div class="campo">
            <label for="f-criterio_acionado">Critério acionado</label>
            <input type="text" id="f-criterio_acionado" data-campo="criterio_acionado" required maxlength="150" placeholder="Ex.: consumo da máquina por leitura">
          </div>
          <div class="campo campo-largo">
            <label for="f-descricao_decisao">Descrição</label>
            <textarea id="f-descricao_decisao" data-campo="descricao_decisao" placeholder="Opcional" rows="3"></textarea>
          </div>
          <div class="campo">
            <label for="f-operador">Operador</label>
            <select id="f-operador" data-campo="operador" required>
              <option value="" disabled selected>Selecione...</option>
              <option value="&gt;">&gt; (maior que)</option>
              <option value="&gt;=">&gt;= (maior ou igual)</option>
              <option value="&lt;">&lt; (menor que)</option>
              <option value="&lt;=">&lt;= (menor ou igual)</option>
              <option value="=">= (igual)</option>
            </select>
          </div>
          <div class="campo">
            <label for="f-limite_referencia">Limite de referência</label>
            <input type="number" id="f-limite_referencia" data-campo="limite_referencia" required step="0.01" placeholder="Ex.: 5.00">
          </div>
          <div class="campo">
            <label for="f-unidade_limite">Unidade do limite</label>
            <input type="text" id="f-unidade_limite" data-campo="unidade_limite" required maxlength="10" placeholder="Ex.: kWh">
          </div>
        </div>
        <div class="acoes">
          <button id="botao-salvar" class="botao botao-principal" type="submit">Cadastrar</button>
          <button id="botao-limpar" class="botao botao-secundario" type="button">Limpar</button>
          <button id="botao-cancelar" class="botao botao-secundario" type="button" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="painel" aria-labelledby="titulo-lista">
      <div class="painel-titulo">
        <h2 id="titulo-lista">Decisões cadastradas</h2>
        <span id="total-registros" class="legenda">Carregando...</span>
      </div>
      <div class="barra-lista">
        <button id="botao-listar" class="botao botao-secundario" type="button">↻ Atualizar lista</button>
      </div>
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th scope="col" data-campo="id_decisao">ID</th>
              <th scope="col" data-campo="nome_decisao">Nome</th>
              <th scope="col" data-campo="criterio_acionado">Critério</th>
              <th scope="col" data-campo="operador">Operador</th>
              <th scope="col" data-campo="limite_referencia" data-formato="numero">Limite</th>
              <th scope="col" data-campo="unidade_limite">Unidade</th>
              <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody id="lista-registros">
            <tr>
              <td colspan="7" class="vazio">Carregando...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer class="rodape">Klyvolt · Decisão</footer>
  </main>
</body>
</html>
