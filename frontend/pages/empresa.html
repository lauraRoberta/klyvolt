<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dados da empresa | Klyvolt</title>
  <link rel="stylesheet" href="../static/empresa.css">
  <link rel="stylesheet" href="../static/painel.css">
  <style>
    input[readonly] { background: #eef2f6; color: var(--texto-suave); cursor: not-allowed; }
    .ajuda { font-size: 13px; color: var(--texto-suave); }
    .ajuda a { color: var(--azul-bebe-forte); font-weight: 600; }
  </style>
  <script src="../js/api.js" defer></script>
  <script src="../js/nav.js" defer></script>
  <script src="../js/empresa.js" defer></script>
</head>
<body class="lilas">
  <header class="cabecalho">
    <div class="container">
      <a class="marca" href="index.html">
        <img class="logo" src="../static/logo-klyvolt.svg" alt="" width="44" height="44">
        <span>Klyvolt</span>
      </a>
      <span class="subtitulo">Gestão de consumo elétrico</span>
    </div>
  </header>

  <main class="container">
    <div class="titulo-pagina">
      <p class="legenda">EMPRESA</p>
      <h1>Dados da empresa</h1>
      <p>Confira e atualize os dados de <strong id="nome-empresa">—</strong>. O CNPJ não pode ser alterado.</p>
    </div>

    <p id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></p>

    <section class="painel" aria-labelledby="titulo-dados">
      <div class="painel-titulo">
        <h2 id="titulo-dados">Informações</h2>
        <span id="aviso-permissao" class="legenda"></span>
      </div>

      <form id="form-empresa" novalidate onsubmit="return false">
        <div class="campos">
          <div class="campo">
            <label for="f-nome">Nome da empresa</label>
            <input type="text" id="f-nome" name="nome" required maxlength="100">
          </div>
          <div class="campo">
            <label for="f-cnpj">CNPJ</label>
            <input type="text" id="f-cnpj" name="cnpj" readonly aria-describedby="ajuda-cnpj">
            <span id="ajuda-cnpj" class="ajuda">Não pode ser alterado.</span>
          </div>
          <div class="campo">
            <label for="f-email">E-mail da empresa</label>
            <input type="email" id="f-email" name="email" required maxlength="100">
          </div>
          <div class="campo">
            <label for="f-telefone">Telefone</label>
            <input type="tel" id="f-telefone" name="telefone" required maxlength="20" inputmode="tel">
          </div>
        </div>
        <div id="acoes" class="acoes">
          <button id="botao-salvar" class="botao botao-principal" type="submit">Salvar alterações</button>
          <button id="botao-desfazer" class="botao botao-secundario" type="button">Desfazer</button>
        </div>
      </form>
      <p class="ajuda">A senha de acesso é a do seu usuário. Para trocá-la, edite o seu usuário na tela <a href="usuario.html">Usuário</a>.</p>
    </section>

    <footer class="rodape">Klyvolt · Empresa</footer>
  </main>
</body>
</html>
