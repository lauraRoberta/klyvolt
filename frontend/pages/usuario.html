<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuário | Klyvolt</title>
  <link rel="stylesheet" href="../static/empresa.css">
  <link rel="stylesheet" href="../static/crud.css">
  <script src="../js/api.js" defer></script>
  <script src="../js/nav.js" defer></script>
  <script src="../js/crud.js" defer></script>
</head>
<body>
  <header class="cabecalho">
    <div class="container">
      <a class="marca" href="empresa.html">
        <img class="logo" src="../static/klyvolt-logo.svg" alt="" width="44" height="44">
        <span>Klyvolt</span>
      </a>
      <span class="subtitulo">Gestão de consumo elétrico</span>
    </div>
  </header>

  <main class="container" data-rota="/usuarios" data-chave="id_usuario" data-nome="usuário" data-editar="sim" data-excluir="nao">
    <div class="titulo-pagina">
    
      <h1>Usuário</h1>
      <p>Cadastre e acompanhe os usuários do sistema.</p>
    </div>

    <p id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></p>

    <section class="painel" aria-labelledby="titulo-formulario">
      <div class="painel-titulo">
        <h2 id="titulo-formulario">Cadastrar usuário</h2>
        <span class="legenda">DADOS</span>
      </div>
      <form id="form-registro" class="formulario" novalidate>
        <div class="campos">
          <div class="campo campo-largo">
            <label for="f-nome_usuario">Nome do usuário</label>
            <input type="text" id="f-nome_usuario" data-campo="nome_usuario" required maxlength="100" placeholder="Digite o nome completo">
          </div>
          <div class="campo">
            <label for="f-email_usuario">E-mail</label>
            <input type="email" id="f-email_usuario" data-campo="email_usuario" required maxlength="100" placeholder="usuario@empresa.com">
          </div>
          <div class="campo">
            <label for="f-senha_usuario">Senha</label>
            <input type="password" id="f-senha_usuario" data-campo="senha_usuario" data-obrigatorio-cadastro="sim" data-omitir-vazio="sim" maxlength="72" pattern="(?=.*[A-Za-z])(?=.*\d).{6,72}" title="A senha deve ter de 6 a 72 caracteres, com letras e números." placeholder="Letras e números, mínimo 6" autocomplete="new-password">
          </div>
          <div class="campo">
            <label for="f-tipo_usuario">Tipo de usuário</label>
            <select id="f-tipo_usuario" data-campo="tipo_usuario" required><option value="" disabled selected>Selecione...</option><option value="Administrador">Administrador</option><option value="Operador">Operador</option><option value="Visualizador">Visualizador</option></select>
          </div>
          <div class="campo">
            <label for="f-id_empresa">Empresa</label>
            <select id="f-id_empresa" data-campo="id_empresa" required data-origem="/empresas" data-valor="id_empresa" data-texto="{nome_empresa} (#{id_empresa})" data-numerico="sim"><option value="" disabled selected>Selecione...</option></select>
          </div>
        </div>
        <div class="acoes">
          <button id="botao-salvar" class="botao botao-principal" type="submit">Cadastrar</button>
          <button id="botao-limpar" class="botao botao-secundario" type="button">Limpar</button>
          <button id="botao-cancelar" class="botao botao-secundario" type="button" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="painel" aria-labelledby="titulo-lista">
      <div class="painel-titulo">
        <h2 id="titulo-lista">Usuários cadastrados</h2>
        <span id="total-registros" class="legenda">Carregando...</span>
      </div>
      <div class="barra-lista">
        <button id="botao-listar" class="botao botao-secundario" type="button">↻ Atualizar lista</button>
      </div>
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th scope="col" data-campo="id_usuario">ID</th>
              <th scope="col" data-campo="nome_usuario">Nome</th>
              <th scope="col" data-campo="email_usuario">E-mail</th>
              <th scope="col" data-campo="tipo_usuario">Tipo</th>
              <th scope="col" data-campo="id_empresa">Empresa</th>
              <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody id="lista-registros">
            <tr>
              <td colspan="6" class="vazio">Carregando...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer class="rodape">Klyvolt · Usuário</footer>
  </main>
</body>
</html>
