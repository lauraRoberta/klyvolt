<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipe | Klyvolt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/empresa.css">
  <link rel="stylesheet" href="../static/inicio.css">
  <style>
    /* Campos vazios mostram um texto-guia em cinza; ao escrever no HTML, o guia some sozinho. */
    .editavel:empty::before { content: attr(data-vazio); font-style: italic; opacity: 0.55; }

    .topo-equipe h1 { margin: 40px 0 12px; font-size: clamp(34px, 5vw, 52px); line-height: 1.1; }
    .intro-equipe { max-width: 62ch; margin: 0 0 28px; font-size: 18px; color: #b9cadb; }

    /* Foto da equipe: coloque o arquivo em static/equipe.jpg (ou troque o endereço abaixo) */
    .foto-equipe {
      min-height: 360px;
      background-color: #14283b;
      background-image: url('../static/equipe.jpg');
      background-size: cover;
      background-position: center;
    }

    .membros {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 28px;
    }
    .membro { display: flex; flex-direction: column; gap: 6px; padding: 18px; }
    .membro-foto {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 260px;
      margin-bottom: 8px;
      border-radius: 14px;
      background-color: #e8f0f6;
      background-size: cover;
      background-position: center;
    }
    .membro h2 { margin: 0; font-size: 22px; line-height: 1.2; }
    .membro-funcao { margin: 0; font-weight: 600; color: var(--azul-bebe-forte); }
    .membro-texto { margin: 0; color: var(--texto-suave); }
  </style>
  <script src="../js/api.js" defer></script>
  <script src="../js/nav.js" defer></script>
</head>
<body class="inicio escuro" data-publica>
  <header class="cabecalho">
    <div class="container">
      <a class="marca" href="index.html">
        <img class="logo" src="../static/klyvolt-logo.svg" alt="" width="44" height="44">
        <span>Klyvolt</span>
      </a>
      <span class="subtitulo">Gestão de consumo elétrico</span>
    </div>
  </header>

  <main class="container">
    <div class="topo-equipe">
      <h1>Nossa equipe</h1>
      <!-- ESCREVA AQUI a apresentação da equipe, entre <p ...> e </p>, sem espaços no meio -->
      <p class="intro-equipe editavel" data-vazio="Escreva aqui uma apresentação da equipe."></p>
    </div>

    <!-- FOTO DA EQUIPE: salve a imagem como frontend/static/equipe.jpg -->
    <div class="foto-equipe cartao" role="img" aria-label="Foto da equipe"></div>

    <section class="membros" aria-label="Integrantes da equipe">
      <!-- Para cada pessoa há um bloco <article>. Copie e cole um bloco para acrescentar mais gente.
           A foto de cada pessoa é o arquivo indicado em url(...): static/membro-1.jpg, membro-2.jpg... -->

      <article class="cartao membro">
        <div class="membro-foto" role="img" aria-label="Foto do integrante" style="background-image: url('../static/membro-1.jpg')"></div>
        <h2 class="editavel" data-vazio="Nome"></h2>
        <p class="membro-funcao editavel" data-vazio="Função"></p>
        <p class="membro-texto editavel" data-vazio="Escreva aqui o que esta pessoa faz no Klyvolt."></p>
      </article>

      <article class="cartao membro">
        <div class="membro-foto" role="img" aria-label="Foto do integrante" style="background-image: url('../static/membro-2.jpg')"></div>
        <h2 class="editavel" data-vazio="Nome"></h2>
        <p class="membro-funcao editavel" data-vazio="Função"></p>
        <p class="membro-texto editavel" data-vazio="Escreva aqui o que esta pessoa faz no Klyvolt."></p>
      </article>

      <article class="cartao membro">
        <div class="membro-foto" role="img" aria-label="Foto do integrante" style="background-image: url('../static/membro-3.jpg')"></div>
        <h2 class="editavel" data-vazio="Nome"></h2>
        <p class="membro-funcao editavel" data-vazio="Função"></p>
        <p class="membro-texto editavel" data-vazio="Escreva aqui o que esta pessoa faz no Klyvolt."></p>
      </article>
    </section>

    <footer class="rodape">Klyvolt · Nossa equipe</footer>
  </main>
</body>
</html>
