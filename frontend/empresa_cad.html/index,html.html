<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Empresa</title>
    <!-- Link para o CSS externo -->
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca de ícones (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="background-pattern"></div>

    <main class="card-container">
        <!-- Cabeçalho -->
        <header>
            <div class="icon-circle">
                <i class="fa-regular fa-building"></i>
                <i class="fa-solid fa-user-tie small-icon"></i>
            </div>
            <h1>Cadastro da empresa</h1>

            <!-- Abas -->
            <div class="tabs">
                <button class="tab active">Nova Empresa</button>
                <button class="tab inactive">Já sou cadastrado</button>
            </div>
        </header>

        <!-- Formulário -->
        <form class="form-content">
            
            <!-- Campo CNPJ -->
            <div class="input-group">
                <label for="cnpj">CNPJ</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-file-lines icon"></i>
                    <input type="text" id="cnpj" placeholder="00.000.000/0000-00">
                </div>
            </div>

            <!-- Campo Nome da Empresa -->
            <div class="input-group">
                <label for="nome">Nome da Empresa</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-building icon"></i>
                    <input type="text" id="nome">
                </div>
            </div>

            <!-- Campo E-mail -->
            <div class="input-group">
                <label for="email">E-mail Corporativo</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope icon"></i>
                    <input type="email" id="email">
                </div>
            </div>

            <!-- Campo Telefone -->
            <div class="input-group">
                <label for="telefone">Telefone/WhatsApp</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone icon"></i>
                    <input type="tel" id="telefone" placeholder="(00) 0000-0000">
                </div>
            </div>

            <!-- Campo Senha -->
            <div class="input-group">
                <label for="senha">Senha de Acesso</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="senha" placeholder="••••••">
                </div>
            </div>

            <!-- Botão Confirmar -->
            <button type="submit" class="btn-confirm">
                <i class="fa-regular fa-circle-check"></i>
                Confirmar Empresa
            </button>

        </form>
    </main>

</body>
</html>
